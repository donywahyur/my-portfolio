# Build the site image on GitHub, push it to GHCR, then tell Coolify to
# pull and restart it. Coolify never builds; docker-compose.prod.yml uses
# the pushed image.
#
# Needs two secrets in the "COOLIFY" environment of this repo
# (Settings > Environments > COOLIFY):
#   COOLIFY_WEBHOOK  the site resource's deploy webhook URL from Coolify
#   COOLIFY_TOKEN    a Coolify API token with deploy permission
# Optional repository variable VITE_STRAPI_URL overrides the Strapi address.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lint
        run: npm ci && npm run lint

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          build-args: |
            VITE_STRAPI_URL=${{ vars.VITE_STRAPI_URL || 'https://strapi.donyramadhan.com' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Environment secrets only reach jobs that name their environment.
    environment: COOLIFY
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_WEBHOOK or COOLIFY_TOKEN secret is not set; skipping deploy."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
